name: CI

# M130 — vérifications automatiques sur chaque PR et push.
# Gates bloquants : typecheck + tests (verts aujourd'hui).
# Lint : informatif/non-bloquant tant que la dette lint (M142, ~87 erreurs) n'est pas résorbée.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck (blocking)
        run: npx tsc --noEmit

      - name: Unit tests (blocking)
        run: npx jest --ci

      - name: Lint (informational — see M142 debt)
        run: npx eslint .
        continue-on-error: true
